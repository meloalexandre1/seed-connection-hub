name: Refresh PDF package lock (temporary)
on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/refresh-pdf-lock.yml'
permissions:
  contents: write
jobs:
  lock:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/pdf-capture-sid-intelligence' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile
        run: bun install
      - name: Commit lockfile only if updated
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: lock Mozilla PDF.js dependency"
            git push origin HEAD:${{ github.head_ref }}
          fi
