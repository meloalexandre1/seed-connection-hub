name: Verify Capture Intelligence

on:
  pull_request:
    paths:
      - 'src/lib/captureIntelligence*'
      - 'src/components/app/CaptureAnalysisPanel.tsx'
      - 'src/components/app/SavedCapturesInbox.tsx'
      - 'docs/supabase/migrations/0010_capture_intelligence.sql'
      - '.github/workflows/verify-capture-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bunx tsc --noEmit
