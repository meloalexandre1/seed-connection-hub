name: Verify Drive Storage

on:
  pull_request:
    paths:
      - 'src/lib/googleDriveStorage.functions.ts'
      - 'src/lib/driveUploadValidation*'
      - 'src/lib/googleCalendar.functions.ts'
      - 'src/routes/api/oauth/drive/return.ts'
      - 'src/services/driveResumable*'
      - 'src/services/googleDriveUpload.ts'
      - 'src/components/app/GoogleDriveStorageConnect.tsx'
      - 'src/components/app/GoogleCalendarConnect.tsx'
      - 'src/routes/_authenticated/agenda.tsx'
      - 'src/routes/_authenticated/configuracoes.tsx'
      - 'src/services/live.ts'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/verify-drive-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Unit and security tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit
