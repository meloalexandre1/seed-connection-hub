name: Verify Notifications

on:
  pull_request:
    paths:
      - 'src/lib/alerts*'
      - 'src/services/alerts.ts'
      - 'src/components/app/AlertsBell.tsx'
      - 'src/components/app/AppShell.tsx'
      - '.github/workflows/verify-notifications.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bunx tsc --noEmit
