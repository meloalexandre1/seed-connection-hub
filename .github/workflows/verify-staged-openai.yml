name: Verify staged OpenAI SID
on:
  pull_request:
    paths:
      - 'src/lib/sid.server.ts'
      - 'src/lib/sidOpenAI.server.ts'
      - 'src/lib/sidOpenAISetup.functions.ts'
      - 'src/components/app/SidOpenAIIntegrationStatus.tsx'
      - 'src/routes/_authenticated/configuracoes.tsx'
      - '.github/workflows/verify-staged-openai.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bunx tsc --noEmit
